[build-system]
requires = [
    "setuptools>=77.0.3,<81.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-hcu"
authors = [{name = "LMCache-HCU Maintainers"}]
license = "Apache-2.0"
readme = "README.md"
description = "HCU/Hygon source patch package for LMCache v0.5.6."
requires-python = ">=3.10,<3.14"
dynamic = ["version"]

[project.scripts]
lmcache-hcu-apply-patches = "lmcache_hcu.integration.patch.apply_patch:main"

[tool.setuptools.dynamic]
version = {attr = "lmcache_hcu._version.__version__"}

[tool.setuptools.packages.find]
where = [""]
include = ["lmcache_hcu", "lmcache_hcu*"]
