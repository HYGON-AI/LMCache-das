name: LMCache HCU PR

on:
  pull_request_target:
    branches: [main, v0.3.13_dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lmcache-hcu-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  framework:
    name: framework-and-pytest
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.event.pull_request.base.sha }}
      source_ref: refs/pull/${{ github.event.pull_request.number }}/merge
      logical_profile: pr
      model_profile: framework
      job_role: framework
      job_key: framework
      runner_kind: nmz1
      visible_devices: "0"
      repeat: "1"
      timeout_minutes: 60
      phase_timeout_seconds: "3000"
      container_memory: 56g
      is_pr: true
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}

  model-tests:
    name: ${{ matrix.job_key }}
    needs: framework
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - job_key: qwen-localdisk
            model_profile: pr-qwen-localdisk
            runner_kind: nmz2
          - job_key: qwen-posix
            model_profile: pr-qwen-posix
            runner_kind: nmz3
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.event.pull_request.base.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: pr
      model_profile: ${{ matrix.model_profile }}
      job_role: model
      job_key: ${{ matrix.job_key }}
      runner_kind: ${{ matrix.runner_kind }}
      visible_devices: "0,1"
      repeat: "1"
      timeout_minutes: 60
      phase_timeout_seconds: "3300"
      container_memory: 56g
      is_pr: true
      expected_base_sha: ${{ github.event.pull_request.base.sha }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}

  aggregate:
    name: hcu-tests
    needs: [framework, model-tests]
    if: >-
      ${{
        always() &&
        vars.LMCACHE_HCU_CI_ENABLED == 'true' &&
        vars.LMCACHE_HCU_RUNNER_ISOLATED == 'true'
      }}
    runs-on: [self-hosted, Linux, X64, ci, bw1100, nmz1]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted aggregate controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate split jobs and publish run summary
        env:
          SOURCE_SHA: ${{ needs.framework.outputs.source_sha }}
        run: |
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          python3 ci/hcu/aggregate-jobs.py \
            --shared-root /ci_public/lmcache-das \
            --profile pr \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --sha "${SOURCE_SHA}" \
            --expected-jobs framework,qwen-localdisk,qwen-posix \
            --repository "${{ github.repository }}"
