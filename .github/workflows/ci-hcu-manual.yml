name: LMCache HCU Manual

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string
      repeat:
        description: Number of complete test repetitions
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      profile:
        description: Reviewed test profile
        required: true
        default: framework
        type: choice
        options: [framework, qwen-smoke, weekly-bw1100, full]
      runner:
        description: Organization runner; auto uses the reviewed multi-node assignment
        required: true
        default: auto
        type: choice
        options: [auto, nmz1, nmz2, nmz3, nmz4, nmz5]

permissions:
  contents: read

concurrency:
  group: lmcache-hcu-manual-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  framework:
    name: framework-and-pytest
    if: >-
      ${{
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/v0.3.13_dev' ||
        github.ref == 'refs/heads/ci-test'
      }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ inputs.ref }}
      logical_profile: manual
      model_profile: framework
      job_role: framework
      job_key: framework
      runner_kind: ${{ inputs.runner == 'auto' && 'nmz1' || inputs.runner }}
      visible_devices: "0"
      repeat: ${{ inputs.repeat }}
      timeout_minutes: 180
      phase_timeout_seconds: "10200"
      container_memory: 56g

  qwen-cpu:
    name: qwen-cpu
    needs: framework
    if: ${{ inputs.profile == 'weekly-bw1100' || inputs.profile == 'full' }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: manual
      model_profile: weekly-qwen-cpu
      job_role: model
      job_key: qwen-cpu
      runner_kind: ${{ inputs.runner == 'auto' && 'nmz1' || inputs.runner }}
      visible_devices: "0,1"
      repeat: ${{ inputs.repeat }}
      timeout_minutes: 360
      phase_timeout_seconds: "21000"
      container_memory: 56g

  qwen-localdisk:
    name: qwen-localdisk
    needs: framework
    if: ${{ inputs.profile != 'framework' }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: manual
      model_profile: ${{ inputs.profile == 'qwen-smoke' && 'pr-qwen-localdisk' || 'weekly-qwen-localdisk' }}
      job_role: model
      job_key: qwen-localdisk
      runner_kind: ${{ inputs.runner == 'auto' && 'nmz2' || inputs.runner }}
      visible_devices: "0,1"
      repeat: ${{ inputs.repeat }}
      timeout_minutes: 360
      phase_timeout_seconds: ${{ inputs.profile == 'qwen-smoke' && '6600' || '21000' }}
      container_memory: 56g

  qwen-posix:
    name: qwen-posix
    needs: framework
    if: ${{ inputs.profile != 'framework' }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: manual
      model_profile: ${{ inputs.profile == 'qwen-smoke' && 'pr-qwen-posix' || 'weekly-qwen-posix' }}
      job_role: model
      job_key: qwen-posix
      runner_kind: ${{ inputs.runner == 'auto' && 'nmz3' || inputs.runner }}
      visible_devices: "0,1"
      repeat: ${{ inputs.repeat }}
      timeout_minutes: 360
      phase_timeout_seconds: ${{ inputs.profile == 'qwen-smoke' && '6600' || '21000' }}
      container_memory: 56g

  deepseek-cpu:
    name: deepseek-cpu
    needs: framework
    if: ${{ inputs.profile == 'weekly-bw1100' || inputs.profile == 'full' }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: manual
      model_profile: weekly-deepseek-cpu
      job_role: model
      job_key: deepseek-cpu
      runner_kind: ${{ inputs.runner == 'auto' && 'nmz4' || inputs.runner }}
      visible_devices: "0,1,2,3,4,5,6,7"
      repeat: ${{ inputs.repeat }}
      timeout_minutes: 360
      phase_timeout_seconds: "21000"
      container_memory: 128g

  deepseek-localdisk:
    name: deepseek-localdisk
    needs: framework
    if: ${{ inputs.profile == 'weekly-bw1100' || inputs.profile == 'full' }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: manual
      model_profile: weekly-deepseek-localdisk
      job_role: model
      job_key: deepseek-localdisk
      runner_kind: ${{ inputs.runner == 'auto' && 'nmz5' || inputs.runner }}
      visible_devices: "0,1,2,3,4,5,6,7"
      repeat: ${{ inputs.repeat }}
      timeout_minutes: 360
      phase_timeout_seconds: "21000"
      container_memory: 128g

  deepseek-posix:
    name: deepseek-posix
    needs: framework
    if: ${{ inputs.profile == 'weekly-bw1100' || inputs.profile == 'full' }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: manual
      model_profile: weekly-deepseek-posix
      job_role: model
      job_key: deepseek-posix
      runner_kind: ${{ inputs.runner == 'auto' && 'nmz1' || inputs.runner }}
      visible_devices: "0,1,2,3,4,5,6,7"
      repeat: ${{ inputs.repeat }}
      timeout_minutes: 360
      phase_timeout_seconds: "21000"
      container_memory: 128g

  aggregate:
    name: manual-summary
    needs:
      - framework
      - qwen-cpu
      - qwen-localdisk
      - qwen-posix
      - deepseek-cpu
      - deepseek-localdisk
      - deepseek-posix
    if: >-
      ${{
        always() &&
        vars.LMCACHE_HCU_CI_ENABLED == 'true' &&
        vars.LMCACHE_HCU_RUNNER_ISOLATED == 'true'
      }}
    runs-on: [self-hosted, Linux, X64, ci, bw1100, nmz1]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted aggregate controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate split jobs and publish run summary
        env:
          SOURCE_SHA: ${{ needs.framework.outputs.source_sha }}
          EXPECTED_JOBS: ${{ inputs.profile == 'framework' && 'framework' || inputs.profile == 'qwen-smoke' && 'framework,qwen-localdisk,qwen-posix' || 'framework,qwen-cpu,qwen-localdisk,qwen-posix,deepseek-cpu,deepseek-localdisk,deepseek-posix' }}
        run: |
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          python3 ci/hcu/aggregate-jobs.py \
            --shared-root /ci_public/lmcache-das \
            --profile manual \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --sha "${SOURCE_SHA}" \
            --expected-jobs "${EXPECTED_JOBS}" \
            --repository "${{ github.repository }}"
