name: LMCache HCU Weekly

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lmcache-hcu-weekly
  cancel-in-progress: false

jobs:
  framework:
    name: framework-and-pytest
    if: >-
      ${{
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/v0.3.13_dev'
      }}
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ github.sha }}
      source_sha_hint: ${{ github.sha }}
      logical_profile: weekly
      model_profile: framework
      job_role: framework
      job_key: framework
      runner_kind: nmz1
      visible_devices: "0"
      repeat: "1"
      timeout_minutes: 90
      phase_timeout_seconds: "4800"
      container_memory: 56g

  model-tests:
    name: ${{ matrix.job_key }}
    needs: framework
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - job_key: qwen-cpu
            model_profile: weekly-qwen-cpu
            visible_devices: "0,1"
            runner_kind: nmz1
          - job_key: qwen-localdisk
            model_profile: weekly-qwen-localdisk
            visible_devices: "0,1"
            runner_kind: nmz2
          - job_key: qwen-posix
            model_profile: weekly-qwen-posix
            visible_devices: "0,1"
            runner_kind: nmz3
          - job_key: deepseek-cpu
            model_profile: weekly-deepseek-cpu
            visible_devices: "0,1,2,3,4,5,6,7"
            runner_kind: nmz4
          - job_key: deepseek-localdisk
            model_profile: weekly-deepseek-localdisk
            visible_devices: "0,1,2,3,4,5,6,7"
            runner_kind: nmz5
          - job_key: deepseek-posix
            model_profile: weekly-deepseek-posix
            visible_devices: "0,1,2,3,4,5,6,7"
            runner_kind: nmz1
    uses: ./.github/workflows/ci-hcu-reusable.yml
    with:
      controller_ref: ${{ github.sha }}
      source_ref: ${{ needs.framework.outputs.source_sha }}
      source_sha_hint: ${{ needs.framework.outputs.source_sha }}
      logical_profile: weekly
      model_profile: ${{ matrix.model_profile }}
      job_role: model
      job_key: ${{ matrix.job_key }}
      runner_kind: ${{ matrix.runner_kind }}
      visible_devices: ${{ matrix.visible_devices }}
      repeat: "1"
      timeout_minutes: 360
      phase_timeout_seconds: "21000"
      container_memory: 128g

  aggregate:
    name: weekly-summary
    needs: [framework, model-tests]
    if: >-
      ${{
        always() &&
        vars.LMCACHE_HCU_CI_ENABLED == 'true' &&
        vars.LMCACHE_HCU_RUNNER_ISOLATED == 'true'
      }}
    runs-on: [self-hosted, Linux, X64, ci, bw1100, nmz1]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted aggregate controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate split jobs and publish run summary
        env:
          SOURCE_SHA: ${{ needs.framework.outputs.source_sha }}
        run: |
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          python3 ci/hcu/aggregate-jobs.py \
            --shared-root /ci_public/lmcache-das \
            --profile weekly \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --sha "${SOURCE_SHA}" \
            --expected-jobs framework,qwen-cpu,qwen-localdisk,qwen-posix,deepseek-cpu,deepseek-localdisk,deepseek-posix \
            --repository "${{ github.repository }}"
