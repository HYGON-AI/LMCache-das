name: LMCache 0.5.6 PR

on:
  pull_request_target:
    branches: [v0.5.6_dev]
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lmcache-v056-pr-${{ github.event.label.name == 'runci' && github.event.sender.type == 'User' && github.run_attempt == '1' && github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.repository == 'HYGON-AI/LMCache-das' &&
      github.event.label.name == 'runci' && github.event.sender.type == 'User' &&
      !github.event.pull_request.draft && github.run_attempt == '1'
    # Use the reviewed branch's workflow, not a copy supplied by the PR.
    uses: HYGON-AI/LMCache-das/.github/workflows/hcu-v056.yml@v0.5.6_dev
